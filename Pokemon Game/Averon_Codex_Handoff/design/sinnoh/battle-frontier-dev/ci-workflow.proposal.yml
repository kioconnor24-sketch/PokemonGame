# INACTIVE PROPOSAL. Do not copy to .github/workflows before genuine scoped
# owner authorization and independent workflow review required by the contract.
name: Averon bounded Battle Frontier DEV build
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scene-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        profile: [NORMAL, RELEASE]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SCENE_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 1
      - name: Install the existing native-gate toolchain
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential binutils-arm-none-eabi gcc-arm-none-eabi \
            libnewlib-arm-none-eabi git libpng-dev python3
      - name: Prepare exact-base marked disposable scene
        run: |
          set -euo pipefail
          scene_root="$RUNNER_TEMP/battle-frontier-runtime"
          evidence="$RUNNER_TEMP/battle-frontier-evidence"
          mkdir -p "$evidence"
          git -C source fetch --no-tags --depth=1 origin f57a79eaf8060bd1da4c412e703345f560dad30a
          git -C source worktree add --no-checkout \
            -b "codex/battle-frontier-runtime-scratch-ci-$GITHUB_RUN_ID-$SCENE_PROFILE" \
            "$scene_root" f57a79eaf8060bd1da4c412e703345f560dad30a
          git -C "$scene_root" sparse-checkout set --cone "Pokemon Game/engine"
          touch "$scene_root/Pokemon Game/engine/.map_qa_throwaway"
          python3 "source/Pokemon Game/Averon_Codex_Handoff/design/sinnoh/battle-frontier-dev/prepare_scene.py" \
            --repo "$scene_root" --install > "$evidence/scene-recipe.json"
          git -C source rev-parse HEAD > "$evidence/source-sha.txt"
          arm-none-eabi-gcc --version > "$evidence/toolchain.txt"
      - name: Build the actual scene ROM in this profile
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/battle-frontier-evidence"
          cd "$RUNNER_TEMP/battle-frontier-runtime/Pokemon Game/engine"
          case "$SCENE_PROFILE" in NORMAL) scene_release=0;; RELEASE) scene_release=1;; *) exit 2;; esac
          make -j4 -O RELEASE="$scene_release" all > "$evidence/build.log" 2>&1 || {
            tail -100 "$evidence/build.log"; exit 1;
          }
          test -s pokeemerald.gba
          sha256sum pokeemerald.gba > "$evidence/rom-sha256.txt"
          stat -c '%s' pokeemerald.gba > "$evidence/rom-bytes.txt"
          python3 "$GITHUB_WORKSPACE/source/Pokemon Game/scripts/check-averon-resource-budget.py" \
            --log "$evidence/build.log" --rom pokeemerald.gba --json "$evidence/resource-budget.json"
      - name: Run the actual focused native regression in NORMAL
        if: matrix.profile == 'NORMAL'
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/battle-frontier-evidence"
          cd "$RUNNER_TEMP/battle-frontier-runtime/Pokemon Game/engine"
          test -x tools/mgba/mgba-rom-test
          make -j4 -O check TESTS=Averon > "$evidence/native.log" 2>&1 || {
            tail -100 "$evidence/native.log"; exit 1;
          }
          if grep -Eq 'No tests found|0 tests (run|executed)' "$evidence/native.log"; then exit 1; fi
          tail -60 "$evidence/native.log"
      - name: Preserve textual evidence only, never ROM, ELF or save files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: averon-battle-frontier-dev-${{ matrix.profile }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/battle-frontier-evidence/*.json
            ${{ runner.temp }}/battle-frontier-evidence/*.txt
            ${{ runner.temp }}/battle-frontier-evidence/*.log
