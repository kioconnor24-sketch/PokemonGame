name: Averon solo evolution audit

on:
  pull_request:
    paths:
      - "Pokemon Game/scripts/audit-averon-solo-evolutions.py"
      - "Pokemon Game/scripts/tests/test_averon_solo_evolutions.py"
      - "Pokemon Game/engine/src/data/pokemon/species_info/**"
      - ".github/workflows/averon-solo-evolution.yml"
  workflow_dispatch:

jobs:
  solo-evolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python3 -m unittest discover -s "Pokemon Game/scripts/tests" -p "test_averon_solo_evolutions.py" -v
      - name: Scan real evolution definitions
        run: |
          python3 "Pokemon Game/scripts/audit-averon-solo-evolutions.py" \
            --engine "Pokemon Game/engine" \
            --json "$RUNNER_TEMP/averon-solo-evolutions.json" \
            --csv "$RUNNER_TEMP/averon-solo-evolutions.csv"
          python3 - "$RUNNER_TEMP/averon-solo-evolutions.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          if report["summary"]["trade_only_source_routes"]:
              raise SystemExit("Unresolved trade-only evolution source paths remain")
          PY
      - name: Attach findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: averon-solo-evolutions
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/averon-solo-evolutions.json
            ${{ runner.temp }}/averon-solo-evolutions.csv
