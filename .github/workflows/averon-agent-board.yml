name: Averon agent dispatch board
# Advisory only. Preserve the workflow name/job context; stop stale #31 writes.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed, ready_for_review, converted_to_draft, edited]
  issue_comment:
    types: [created]
  schedule:
    - cron: "31 13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: averon-agent-board
  cancel-in-progress: false

jobs:
  route:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.number == 15 &&
       startsWith(github.event.comment.body, 'CLAIM |'))
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # No checkout and no execution of PR code or user-controlled expressions.
      - name: Read live PR metadata and publish advisory summary
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100
            });
            const main = await github.rest.repos.getBranch({owner, repo, branch: 'main'});
            const snapshot = {generated_at: new Date().toISOString(),
              main_sha: main.data.commit.sha, pull_requests: []};
            const lines = ['# Live repository PR snapshot',
              'Advisory metadata only. Follow the operating contract and integration queue linked from Issue #15.',
              'Archived Issue #31 and legacy tasks.json do not assign current work.',
              'Main: ' + snapshot.main_sha,
              'No review, creative approval, merge authorization, or agent restart is inferred.'];
            for (const pr of prs) {
              const checks = await github.paginate(github.rest.checks.listForRef, {
                owner, repo, ref: pr.head.sha, per_page: 100
              });
              // Re-runs can share a head; retain the newest run per app/job name.
              const latest = new Map();
              for (const run of checks) {
                const key = String(run.app?.id ?? 'unknown') + ':' + run.name;
                if (!latest.has(key) || run.id > latest.get(key).id) latest.set(key, run);
              }
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner, repo, pull_number: pr.number, per_page: 100
              });
              const currentReviews = reviews.filter(r => r.commit_id === pr.head.sha);
              const checkRows = [...latest.values()].map(c => ({
                name: c.name, status: c.status, conclusion: c.conclusion, url: c.html_url
              }));
              snapshot.pull_requests.push({number: pr.number, url: pr.html_url,
                draft: pr.draft, base_sha: pr.base.sha, head_sha: pr.head.sha,
                checks: checkRows, current_head_reviews: currentReviews.map(r => ({
                  state: r.state, url: r.html_url, commit_id: r.commit_id
                }))});
              const state = checkRows.length ? checkRows.map(c =>
                c.name + '=' + (c.conclusion || c.status)).join(', ') : 'checks UNKNOWN';
              lines.push('- [#' + pr.number + '](' + pr.html_url + ') '
                + (pr.draft ? 'DRAFT' : 'OPEN') + ' head ' + pr.head.sha
                + '; current-head submitted reviews: ' + currentReviews.length
                + '; ' + state);
            }
            // No title/body interpolation into executable code or authorization markers.
            const fs = require('fs');
            fs.writeFileSync('/tmp/averon-live-prs.json', JSON.stringify(snapshot, null, 2));
            core.summary.addRaw(lines.join('\n\n'));
            await core.summary.write();
      - uses: actions/upload-artifact@v4
        with:
          name: live-pr-snapshot
          path: /tmp/averon-live-prs.json
          retention-days: 14
