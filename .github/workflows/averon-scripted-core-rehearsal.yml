name: Averon staged SCRIPTED-BATTLE core rehearsal

# This tests an ephemeral split; it NEVER pushes a PR, registers a scene,
# approves a protected source write or changes the QUEST graphical gate.
on:
  pull_request:
    paths:
      - ".github/workflows/averon-scripted-core-rehearsal.yml"
      - "Pokemon Game/scripts/coordination/stage_scripted_core.py"
      - "Pokemon Game/scripts/coordination/test_stage_scripted_core.py"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: staged-scripted-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staged-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test the surgical split preflight (no ROM)
        run: |
          python3 -m unittest discover -s "Pokemon Game/scripts/coordination" -p "test_stage_scripted_core.py" -v
      - name: Verify same-repo PR 25 and pin both sources
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/averon-staged-evidence"
          gh api "repos/$GITHUB_REPOSITORY/pulls/25" > "$RUNNER_TEMP/averon-staged-evidence/pr-25.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" \
            '.state == "open" and .head.repo.full_name == $repo and .base.repo.full_name == $repo' \
            "$RUNNER_TEMP/averon-staged-evidence/pr-25.json" > /dev/null
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/pull/25/head:refs/remotes/origin/scripted-25'
          main_sha=$(git rev-parse refs/remotes/origin/main)
          actual=$(git rev-parse refs/remotes/origin/scripted-25)
          expected=$(jq -r '.head.sha' "$RUNNER_TEMP/averon-staged-evidence/pr-25.json")
          test "$actual" = "$expected" || {
            echo "FAIL: PR #25 moved during fetch"; exit 1;
          }
          printf 'MAIN_SHA=%s\nSCRIPTED_PR25_SHA=%s\n' "$main_sha" "$actual" \
            | tee "$RUNNER_TEMP/averon-staged-evidence/source-pins.txt"
          git worktree add --detach "$RUNNER_TEMP/averon-staged-build" "$main_sha"
          git -C "$RUNNER_TEMP/averon-staged-build" \
            -c user.name='Averon Read-only Rehearsal' \
            -c user.email='rehearsal@users.noreply.github.com' \
            merge --no-ff --no-edit "$actual"
          python3 "Pokemon Game/scripts/coordination/stage_scripted_core.py" \
            --worktree "$RUNNER_TEMP/averon-staged-build" \
            --base-sha "$main_sha" \
            --json "$RUNNER_TEMP/averon-staged-evidence/staging.json"
          git -C "$RUNNER_TEMP/averon-staged-build" diff --check
          echo "STAGED CORE ONLY: one temporary macro registration removed; neither #14 nor #25 was modified"
      - name: Install real GBA/native toolchain
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential binutils-arm-none-eabi gcc-arm-none-eabi \
            libnewlib-arm-none-eabi git libpng-dev python3
      - name: Compile temporary staged core and run actual native/save tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/averon-staged-build/Pokemon Game/engine"
          make -j4 -O all > "$RUNNER_TEMP/averon-staged-evidence/build.log" 2>&1 || {
            tail -130 "$RUNNER_TEMP/averon-staged-evidence/build.log"; exit 1;
          }
          test -s pokeemerald.gba
          sha256sum pokeemerald.gba > "$RUNNER_TEMP/averon-staged-evidence/ephemeral-rom-sha256.txt"
          make -j4 -O check TESTS=Averon > "$RUNNER_TEMP/averon-staged-evidence/native.log" 2>&1 || {
            tail -110 "$RUNNER_TEMP/averon-staged-evidence/native.log"; exit 1;
          }
          make -j4 -O check TESTS=test/save.c > "$RUNNER_TEMP/averon-staged-evidence/save.log" 2>&1 || {
            tail -110 "$RUNNER_TEMP/averon-staged-evidence/save.log"; exit 1;
          }
          python3 - <<'PY'
          from pathlib import Path
          import os
          import runpy
          evidence = Path(os.environ['RUNNER_TEMP']) / 'averon-staged-evidence'
          parser = runpy.run_path('../scripts/coordination/verify_build_readiness.py')
          for name in ('native', 'save'):
              outcome = parser['parse_test_log']((evidence / f'{name}.log').read_text(), name)
              print(f"EXECUTED {name}: {outcome['passed']}/{outcome['total']} passed")
          print('STAGED CORE PASSED BUILD/NATIVE/SAVE; NOT REGISTERED, QA-ACCEPTED OR MERGED')
          PY
          tail -14 "$RUNNER_TEMP/averon-staged-evidence/native.log"
          tail -14 "$RUNNER_TEMP/averon-staged-evidence/save.log"
      - name: Save text evidence only, never ROM or saves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: averon-staged-core-rehearsal-evidence
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/averon-staged-evidence/source-pins.txt
            ${{ runner.temp }}/averon-staged-evidence/staging.json
            ${{ runner.temp }}/averon-staged-evidence/*.log
            ${{ runner.temp }}/averon-staged-evidence/ephemeral-rom-sha256.txt
          retention-days: 14
