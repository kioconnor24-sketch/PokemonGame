name: Averon PR hygiene

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  schedule:
    - cron: "23 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  file-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Block ROM, save and private-key uploads; report PR collisions
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const number = context.issue.number;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: number, per_page: 100
            });
            const live = files.filter(f => f.status !== 'removed');
            const badROM = live.filter(f => /\.(gba|gbc|gb|nds|sav|srm)$/i.test(f.filename));
            const badSecrets = live.filter(f => /(^|\/)\.env$|\.pem$|\.p12$|\.pfx$|(^|\/)id_rsa$/i.test(f.filename));
            for (const file of badROM) core.error('Complete ROM/save file: ' + file.filename);
            for (const file of badSecrets) core.error('Possible private key/secret: ' + file.filename);
            if (badROM.length || badSecrets.length) core.setFailed('Remove ROM/save/secret files before merging');
            if (files.length > 70) core.warning('Large PR: ' + files.length + ' paths. Confirm generated files and scope.');
            if (context.payload.pull_request.base.ref !== 'main')
              core.warning('Non-main PR base: verify stacked dependency order.');

            const open = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100
            });
            const overlaps = [];
            for (const peer of open.filter(p => p.number !== number).slice(0, 20)) {
              const theirs = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: peer.number, per_page: 100
              });
              const peerPaths = new Set(theirs.filter(f => f.status !== 'removed').map(f => f.filename));
              const same = live.map(f => f.filename).filter(p => peerPaths.has(p));
              if (same.length) overlaps.push('#' + peer.number + ': ' + same.slice(0, 5).join(', '));
            }
            for (const overlap of overlaps)
              core.warning('Source overlap with another open PR: ' + overlap + '. Reconcile before merge.');
            core.info('File guard checked ' + files.length + ' changes; open PR overlaps ' + overlaps.length);

  weekly-readonly-audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Report stale pull requests, main branch protection and latest native build
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const branch = await github.rest.repos.getBranch({owner, repo, branch: 'main'});
            const open = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100
            });
            const stale = open.filter(p => Date.now() - new Date(p.updated_at).getTime() > 14 * 86400000);
            const buildRuns = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'averon-native-build.yml', branch: 'main', per_page: 10
            });
            const latestComplete = buildRuns.data.workflow_runs.find(r => r.status === 'completed');
            const protectedMain = branch.data.protected === true;
            const buildText = latestComplete
              ? latestComplete.conclusion + ' — ' + latestComplete.html_url
              : 'No completed main native build found';
            const older = stale.length
              ? stale.map(p => '- [#' + p.number + ' ' + p.title + '](' + p.html_url + ')').join('\n')
              : 'None';
            const report = [
              '# Pokémon Averon weekly repository health',
              '**Open PRs:** ' + open.length,
              '**PRs untouched for 14+ days:**\n' + older,
              '**Main branch protected:** ' + (protectedMain ? 'Yes' : 'NO — owner setup needed'),
              '**Latest completed main native build:** ' + buildText,
              '*This is a read-only audit; it does not merge, close, rewrite or delete source.*'
            ].join('\n\n');
            core.summary.addRaw(report);
            await core.summary.write();
            if (!protectedMain) core.warning('main has no protection. See WORKFLOW.md section 8 for the one-time owner setting.');
            if (latestComplete && latestComplete.conclusion !== 'success')
              core.warning('Latest completed main build was not successful: ' + latestComplete.html_url);
            if (stale.length)
              core.warning(stale.length + ' PR(s) inactive over 14 days; review without automatically deleting them.');
