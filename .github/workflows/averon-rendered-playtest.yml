name: Averon rendered emulator smoke playtest

on:
  pull_request:
    paths:
      - ".github/workflows/averon-rendered-playtest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendered-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install GBA build and graphical emulator tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential binutils-arm-none-eabi gcc-arm-none-eabi \
            libnewlib-arm-none-eabi git libpng-dev python3 \
            mgba-sdl xvfb xdotool openbox imagemagick xauth
      - name: Compile ROM for isolated test (never upload ROM or save)
        working-directory: "Pokemon Game/engine"
        run: |
          make -j4 -O all > "$RUNNER_TEMP/playtest-build.log" 2>&1 || {
            tail -120 "$RUNNER_TEMP/playtest-build.log"
            exit 1
          }
          test -s pokeemerald.gba
          sha256sum pokeemerald.gba
          stat -c 'ROM bytes: %s' pokeemerald.gba
      - name: Launch actual graphical mGBA and capture controller milestones
        shell: bash
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: x11
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/averon-playtest"
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 -nolisten tcp > "$RUNNER_TEMP/averon-playtest/xvfb.log" 2>&1 &
          xvfb_pid=$!
          sleep 2
          openbox > "$RUNNER_TEMP/averon-playtest/window-manager.log" 2>&1 &
          sleep 2
          mgba -2 "Pokemon Game/engine/pokeemerald.gba" > "$RUNNER_TEMP/averon-playtest/mgba.log" 2>&1 &
          emu_pid=$!
          cleanup() { kill "$emu_pid" "$xvfb_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          win=""
          for i in $(seq 1 25); do
            win=$(xdotool search --onlyvisible --name "mGBA" 2>/dev/null | head -1 || true)
            if [ -n "$win" ]; then break; fi
            if ! kill -0 "$emu_pid" 2>/dev/null; then
              echo "Emulator exited prematurely:"
              cat "$RUNNER_TEMP/averon-playtest/mgba.log"
              exit 1
            fi
            sleep 1
          done
          if [ -z "$win" ]; then
            echo "No mGBA window after 25 seconds"
            xdotool search --onlyvisible --name '.*' getwindowname || true
            cat "$RUNNER_TEMP/averon-playtest/mgba.log"
            exit 1
          fi
          xdotool windowactivate --sync "$win" || true
          echo "mGBA WINDOW=$win"
          mgba --version 2>&1 || true
          capture() {
            local stage="$1"
            local filename="$RUNNER_TEMP/averon-playtest/$stage.png"
            import -window "$win" "$filename"
            convert "$filename" -resize 240x160 -colors 96 PNG8:"$RUNNER_TEMP/averon-playtest/$stage-small.png"
            python3 - "$filename" "$stage" <<'PY'
          import subprocess, sys
          p, label=sys.argv[1:]
          out=subprocess.check_output(['identify','-format','%wx%h %[colors]c',p],text=True)
          print('SCREENSHOT',label,out,flush=True)
          PY
            echo "IMAGE_BASE64_BEGIN:$stage"
            base64 -w 0 "$RUNNER_TEMP/averon-playtest/$stage-small.png"
            echo
            echo "IMAGE_BASE64_END:$stage"
          }
          press() {
            xdotool windowactivate "$win" || true
            xdotool key --clearmodifiers --delay 80 "$1"
          }
          sleep 9
          capture boot
          press Return
          sleep 4
          capture title-start
          press x
          sleep 8
          capture new-game
          for i in $(seq 1 12); do
            press x
            sleep 0.65
          done
          capture dialogue-advance
          press Return
          sleep 3
          capture after-start
          for i in $(seq 1 12); do
            press x
            sleep 0.65
          done
          capture continued
          # Verified mapping in prior screenshots: x selects a menu entry,
          # z advances text but does not select BOY/GIRL.
          # The same quest source/ROM will be rebuilt and retested.
          for i in $(seq 1 40); do
            press z
            sleep 0.08
          done
          capture "gender-selection"
          press x
          sleep 1
          capture "chosen-boy"
          press z
          sleep 1
          capture "naming-screen"
          press x
          sleep 0.8
          capture "name-letter"
          press Return
          sleep 1
          capture "name-start"
          press x
          sleep 1
          capture "name-confirm"
          for i in $(seq 1 45); do
            press z
            sleep 0.1
            if (( i % 15 == 0 )); then capture "post-name-b-$i"; fi
          done
          for i in $(seq 1 20); do
            press x
            sleep 0.15
            if (( i % 5 == 0 )); then capture "post-name-a-$i"; fi
          done
          # Continue past post-naming professor dialogue toward actual field play.
          for i in $(seq 1 80); do
            press x
            sleep 0.15
            if (( i % 10 == 0 )); then capture "opening-after-name-$i"; fi
          done
          # QUEST locator: use the GAME'S BUILT-IN developer map-warp menu.
          # This never edits event flags, party or inventory, but reaching Alderfield
          # through debug warp is labeled FIXTURE ACCESS (not normal progression).
          capture "Q1-pre-debug"
          # Verify that field input is unlocked (ordinary Start -> menu -> B).
          press Return
          sleep 1
          capture "Q1-ordinary-start"
          press z
          sleep 1
          capture "Q1-ordinary-start-closed"
          # DEBUG_OVERWORLD_HELD_KEYS = R; START must become NEW after R
          # has been held for several emulated frames, not in same host tick.
          xdotool windowactivate --sync "$win" || true
          xdotool keydown s
          sleep 0.55
          xdotool key --clearmodifiers Return
          sleep 0.9
          xdotool keyup s
          sleep 0.8
          capture "Q1-debug-main"
          press x
          sleep 0.8
          capture "Q1-utilities-menu"
          press Down
          press x
          sleep 1
          capture "Q1-warp-group-before"
          # Actual debug.c numeric editor: tDigit=0 starts ones, Right=tens.
          # Map group gMapGroup_AveronOpening=76 (map_groups.json).
          press Right
          for i in $(seq 1 7); do press Up; sleep 0.12; done
          press Left
          for i in $(seq 1 6); do press Up; sleep 0.12; done
          capture "Q1-warp-group-76"
          press x
          sleep 0.8
          # The existing Alderfield map is local map number 9 in group 76.
          for i in $(seq 1 9); do press Up; sleep 0.12; done
          capture "Q1-warp-map-9"
          press x
          sleep 0.8
          # Existing Alderfield clinic door is warp index 1.
          press Up
          capture "Q1-warp-index-1"
          press x
          sleep 3
          capture "Q1-alderfield-after-warp"
          # Best-effort visual navigation toward researcher (12,16):
          # inspect screenshots; do not infer a successful interaction from x presses.
          xdotool keydown Left; sleep 0.8; xdotool keyup Left
          sleep 0.7
          capture "Q1-alderfield-left"
          xdotool keydown Down; sleep 0.8; xdotool keyup Down
          sleep 0.7
          capture "Q1-alderfield-down"
          press x
          sleep 1
          capture "Q1-researcher-attempt"
          if ! kill -0 "$emu_pid" 2>/dev/null; then
            echo "Emulator exited unexpectedly"
            cat "$RUNNER_TEMP/averon-playtest/mgba.log"
            exit 1
          fi
      - name: Attach only screenshots and logs (NO ROM or save)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: averon-rendered-smoke-evidence
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/averon-playtest/*.png
            ${{ runner.temp }}/averon-playtest/*.log
            ${{ runner.temp }}/playtest-build.log
