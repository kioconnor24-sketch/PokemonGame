name: Averon source checks

on:
  pull_request:
    paths:
      - "Pokemon Game/scripts/**"
      - "Pokemon Game/Averon_Codex_Handoff/data/**"
      - "Pokemon Game/Averon_Codex_Handoff/qa/**"
      - ".github/workflows/averon-source-checks.yml"
  push:
    branches: [main]
    paths:
      - "Pokemon Game/scripts/**"
      - "Pokemon Game/Averon_Codex_Handoff/data/**"
      - ".github/workflows/averon-source-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: averon-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax checks (no compilation or ROM assets)
        run: python3 -m compileall -q "Pokemon Game/scripts"
      - name: Independent Averon source regression tests
        shell: bash
        run: |
          set -euo pipefail
          checked=0
          for name in \
            test-audit-averon-species.py \
            test-audit-averon-map-encounters.py \
            test-audit-averon-evolution-reach.py \
            test-averon-sidequests.py \
            test-averon-quest-flow.py \
            test-check-averon-native-baseline.py \
            test-audit-averon-progression.py
          do
            file="Pokemon Game/scripts/$name"
            if test -f "$file"; then
              printf '\n=== %s ===\n' "$name"
              python3 "$file"
              checked=$((checked + 1))
            fi
          done
          if test "$checked" -eq 0; then
            echo "No independent regression tests found; source compilation only."
          else
            echo "Executed $checked independent test modules."
          fi
      - name: Verify sidequest overlay against Codex's current maps
        if: github.event_name == 'pull_request' && github.head_ref == 'chatgpt/early-quests-and-world-progression'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          from tempfile import TemporaryDirectory
          from urllib.parse import quote
          from urllib.request import urlopen

          # Fetch only files read by the overlay installer; do not clone the
          # large engine again and do not generate or publish any game ROM.
          repo = 'kioconnor24-sketch/PokemonGame'
          ref = 'codex/first-gym-verification'
          required = [
              'include/constants/flags.h',
              'data/event_scripts.s',
              'data/layouts/layouts.json',
          ]
          for name in ['Alderfield', 'CoastalBluffs', 'Windrow', 'CoastalMeadow']:
              required.append('data/maps/' + name + '/map.json')
              required.append('data/layouts/' + name + '/map.bin')
          with TemporaryDirectory() as directory:
              engine = Path(directory) / 'engine'
              for rel in required:
                  source = ('https://raw.githubusercontent.com/' + repo + '/' + ref
                            + '/Pokemon%20Game/engine/' + quote(rel, safe='/'))
                  target = engine / rel
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with urlopen(source, timeout=30) as response:
                      target.write_bytes(response.read())
              subprocess.run([
                  sys.executable, 'Pokemon Game/scripts/build-averon-sidequests.py',
                  '--engine', str(engine),
              ], check=True)
              print('PASS: current first-Gym source maps and flag slots accept sidequest overlay.')
          PY
      - name: Planned route graph validation
        shell: bash
        run: |
          set -euo pipefail
          script="Pokemon Game/scripts/audit-averon-progression.py"
          if test -f "$script"; then
            python3 "$script" --project "Pokemon Game"
          else
            echo "Route graph audit not included in this branch; skipping."
          fi
